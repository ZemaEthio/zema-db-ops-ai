<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ZEMA DB Operations AI MVP" />
  <title>ZEMA DB Operations AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">Z</span><div><strong>ZEMA</strong><small>DB Operations AI</small></div></div>
      <nav id="nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="instances">SQL Instances</button>
        <button class="nav-item" data-view="incidents">Incidents <span id="incidentBadge" class="badge"></span></button>
        <button class="nav-item" data-view="security">Security</button>
        <button class="nav-item" data-view="capacity">Capacity</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> Demo collector online</div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow">INTELLIGENT SQL OPERATIONS</p><h1 id="pageTitle">Operations overview</h1></div>
        <div class="top-actions">
          <label class="tenant-picker">Organization<select id="tenantSelect" aria-label="Organization"></select></label>
          <button id="refreshBtn" class="primary">Run demo scan</button>
        </div>
      </header>
      <section id="scanNotice" class="notice hidden" role="status"></section>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="incidentDialog">
    <form method="dialog">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <p class="eyebrow">INCIDENT DETAIL</p><h2 id="dialogTitle"></h2><div id="dialogBody"></div>
      <menu><button value="cancel" class="secondary">Close</button><button id="resolveBtn" value="default" class="primary">Mark resolved</button></menu>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
